<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cofinder Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="search-container">
        <div class="search-box">
            <input type="text" id="user-input" class="user-query" placeholder="Ingresa un prompt">
            <button onclick="sendMessage()">Buscar</button>
        </div>
    </div>

    <div id="chatbox" class="chat-container"></div>

    <script>
        function sendMessage() {
            const inputField = document.getElementById("user-input");
            const userMessage = inputField.value;
            if (!userMessage) return;

            // Añadir el mensaje del usuario al chat
            addMessageToChat("user-message", userMessage);
            inputField.value = "";

            // Enviar el mensaje al servidor
            fetch("/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ prompt: userMessage })
            })
            .then(response => response.json())
            .then(data => {
                // Añadir solo la respuesta generada por el bot al chat
                if (data.products) {
                    let productList = "<ul>";
                    data.products.forEach(product => {
                        productList += `
                            <li>
                                <strong>${product.nombre}</strong> (Código: ${product.codigo_web}) - ${product.descripcion}
                                <br><em>Distancia a la consulta: ${product.distance_to_query}</em>
                            </li>`;
                    });
                    productList += "</ul>";
                    addMessageToChat("bot-message", productList);
                } else {
                    addMessageToChat("bot-message", data.response);
                }

                // Mostrar el tiempo de respuesta
                if (data.response_time) {
                    addMessageToChat("bot-message", `<em>Tiempo de respuesta: ${data.response_time.toFixed(2)} segundos</em>`);
                }
            })
            .catch(error => {
                addMessageToChat("bot-message", "Lo siento, ocurrió un error.");
                console.error("Error en la solicitud:", error);
            });
        }

        function addMessageToChat(className, message) {
            const chatbox = document.getElementById("chatbox");
            const messageElement = document.createElement("div");
            messageElement.classList.add("message", className);
            
            // Formatear el mensaje para que reconozca títulos y subtítulos
            messageElement.innerHTML = message
                .replace(/\*\s\*\*(.*?)\*\*\s/g, '<strong>$1</strong>') // Títulos
                .replace(/\*\s(.*?)\s/g, '<h3>$1</h3>'); // Subtítulos

            chatbox.appendChild(messageElement);
            chatbox.scrollTop = chatbox.scrollHeight;  // Auto-scroll hacia abajo
        }
    </script>
</body>
</html>
